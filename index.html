<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Koneksi JSONBin</title>
</head>
<body style="font-family:sans-serif; padding:20px;">
  <h3>Status Koneksi JSONBin.io</h3>
  <p id="status">🔄 Sedang mengecek...</p>
  <button onclick="tesSimpan()" style="padding:12px 16px; font-size:16px;">💾 Tes Simpan Data ke Cloud</button>
  <pre id="hasil" style="background:#f1f5f9; padding:12px; margin-top:14px; white-space:pre-wrap;"></pre>

  <script>
    const BIN_ID = "6af7f70effd5d16053c042b5";
    const API_KEY = "$2a$10$H.5ze8j.IuGbXeSKyzuzFe8DKGGaRho/ddja5adbLm5dvrLbGuFou";
    const URL = "https://jsonbin.io" + BIN_ID;

    async function cekBaca() {
      try {
        const res = await fetch(URL + "/latest?t=" + Date.now(), {
          headers: { "X-Master-Key": API_KEY, "X-Bin-Meta": "false" }
        });
        const teks = await res.text();
        document.getElementById("status").innerText = res.ok ? "🟢 TERHUBUNG!" : "❌ ERROR HTTP: " + res.status;
        document.getElementById("hasil").innerText = teks;
      } catch (e) {
        document.getElementById("status").innerText = "❌ GAGAL: " + e.message;
      }
    }

    async function tesSimpan() {
      document.getElementById("status").innerText = "⏳ Menyimpan...";
      try {
        const res = await fetch(URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
          body: JSON.stringify({ soal: {}, bab: { tes: ["Berhasil Sinkron!"] }, rekap: [], pin: "123456" })
        });
        const teks = await res.text();
        document.getElementById("status").innerText = res.ok ? "🟢 BERHASIL SIMPAN!" : "❌ GAGAL SIMPAN: " + res.status;
        document.getElementById("hasil").innerText = teks;
      } catch (e) {
        document.getElementById("status").innerText = "❌ ERROR: " + e.message;
      }
    }

    cekBaca();
  </script>
</body>
</html>
