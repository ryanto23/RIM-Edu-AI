    function acakArray(arr) {
      const hasil = [...arr];
      for (let i = hasil.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [hasil[i], hasil[j]] = [hasil[j], hasil[i]];
      }
      return hasil;
    }

    function siapkanSoalAcak(daftarMentah, maksimalSoal = 20) {
      const soalTeracak = acakArray(daftarMentah).slice(0, maksimalSoal);
      return soalTeracak.map((item) => {
        const indeksOpsi = item.p.map((_, idx) => idx);
        const indeksOpsiAcak = acakArray(indeksOpsi);

        const pBaru = indeksOpsiAcak.map(idx => item.p[idx]);
        const bBaru = indeksOpsiAcak.indexOf(item.b);
        const pImgBaru = Array.isArray(item.pImg) ? indeksOpsiAcak.map(idx => item.pImg[idx] || "") : undefined;
        const pSvgBaru = Array.isArray(item.pSvg) ? indeksOpsiAcak.map(idx => item.pSvg[idx] || "") : undefined;

        return {
          ...item,
          p: pBaru,
          b: bBaru,
          ...(pImgBaru ? { pImg: pImgBaru } : {}),
          ...(pSvgBaru ? { pSvg: pSvgBaru } : {})
        };
      });
    }

        };
        document.body.appendChild(s);
      });
    }

    function pilihKelas(jenjang) {

    async function siapkanSesiKhusus(jenisTes, nomorSesi, namaSesi) {
      sesi.tipe = jenisTes;
      sesi.nomorSesi = nomorSesi;
      sesi.namaSesi = namaSesi;
      const namaFile = buatNamaFileSoalKhusus(jenisTes, sesi.kodeMapel, nomorSesi);

      app().innerHTML = `<div class="form-box" style="text-align:center; padding:30px;">⏳ Memuat soal <b>${esc(sesi.namaMapel)} (${namaSesi})</b>...</div>`;
      const hasil = await muatFileSoalDariNama(namaFile, sesi.kodeMapel);
      sesi.namaFile = hasil.namaFile;
      bankSoalMentah = hasil.soal;

      tampilkanFormNama(
        `pilihSesiTesKhusus('${jenisTes}', '${sesi.kodeMapel}', '${esc(sesi.namaMapel)}')`,

    function tampilkanFormNama(aksiKembali, keteranganUjian) {
      const jumlahTampil = Math.min(bankSoalMentah.length, 20);
      app().innerHTML = `
        <div class="form-box">
          <button class="btn-back" onclick="${aksiKembali}">⬅ Kembali</button>
          <h3 style="font-size:1.1rem; margin-bottom:4px;">Identitas Peserta Ujian</h3>
          <p style="font-size:0.84rem; color:#64748b; margin-bottom:14px;">
            <b>${keteranganUjian}</b><br>
            Jumlah Soal: <b>${jumlahTampil} Soal Pilihan Ganda</b> (Waktu: 45 Menit)
          </p>
          <label>Nama Lengkap</label>
          <input type="text" id="inp-nama" placeholder="Masukkan nama lengkap Anda">
          <button type="button" class="btn-primary" onclick="mulaiKuis()">🚀 Mulai Kerjakan ${sesi.namaSesi}</button>
        </div>`;
    }
    function mulaiKuis() {
      const nama = document.getElementById("inp-nama").value.trim();
      if (!nama) return alert("Masukkan Nama Lengkap terlebih dahulu!");

      sesi.nama = nama;
      if (sesi.tipe === "sekolah") {
        sesi.kodeUjian = `KLS${sesi.nomorKelas}-${sesi.kodeMapel.toUpperCase()}-B${sesi.nomorBab}-S${sesi.nomorSesi}`;
      } else {
        sesi.kodeUjian = `${sesi.tipe.toUpperCase()}-${sesi.kodeMapel.toUpperCase()}-S${sesi.nomorSesi}`;
      }

      soalList = siapkanSoalAcak(bankSoalMentah, 20);
      jawabanUser = new Array(soalList.length).fill(null);
      idxSoal = 0;
      sisaWaktu = 45 * 60;

      clearInterval(timer);
      timer = setInterval(() => {
        const t = document.getElementById("kuis-timer");
        sisaWaktu--;
        if (t) t.innerText = `⏱️ ${Math.floor(sisaWaktu / 60)}:${String(sisaWaktu % 60).padStart(2, "0")}`;
        if (sisaWaktu <= 0) {
          clearInterval(timer);
          alert("Waktu ujian telah habis! Jawaban otomatis dikumpulkan.");
          selesaiKuis(true);
        }
      }, 1000);

      renderSoal();
    }

    function lompatSoal(targetIdx) {
      if (targetIdx < 0 || targetIdx >= soalList.length) return;
      idxSoal = targetIdx;
      renderSoal();
    }

    function pilihJawaban(i) {
      jawabanUser[idxSoal] = i;
      renderSoal();
    }

    function renderVisual(imgUrl, svgCode, kelasCss) {
      if (svgCode && String(svgCode).trim().startsWith("<svg")) {
        return `<div class="${kelasCss}" style="padding:8px; overflow:auto;">${svgCode}</div>`;
      }
      if (imgUrl) {
        return `<img src="${esc(imgUrl)}" class="${kelasCss}" alt="Gambar">`;
      }
      return "";
    }

    function renderSoal() {
      const s = soalList[idxSoal], abjad = ["A", "B", "C", "D"];
      const jmlDijawab = jawabanUser.filter(j => j !== null).length;
      const teksTimer = `⏱️ ${Math.floor(sisaWaktu / 60)}:${String(sisaWaktu % 60).padStart(2, "0")}`;

      const gridNomor = soalList.map((_, idx) => {
        const cls = idx === idxSoal ? "num-box current" : (jawabanUser[idx] !== null ? "num-box answered" : "num-box");
        return `<button type="button" class="${cls}" onclick="lompatSoal(${idx})">${idx + 1}</button>`;
      }).join("");

      const tombolSebelumnya = idxSoal > 0
        ? `<button type="button" class="btn-back" style="margin:0; flex:1;" onclick="lompatSoal(${idxSoal - 1})">⬅ Sebelumnya</button>`
        : `<div style="flex:1;"></div>`;

      const tombolSelanjutnya = idxSoal < soalList.length - 1
        ? `<button type="button" class="btn-primary" style="flex:1;" onclick="lompatSoal(${idxSoal + 1})">Selanjutnya ➔</button>`
        : `<button type="button" class="btn-pdf" style="margin:0; flex:1;" onclick="selesaiKuis(false)">✅ Selesai & Lihat Nilai</button>`;

      const blokVisualSoal = renderVisual(s.img, s.svg, "soal-img");

      app().innerHTML = `
        <div class="form-box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-size:0.84rem; font-weight:700; color:#4f46e5;">${sesi.namaSesi} • Soal ${idxSoal + 1} / ${soalList.length} (Dijawab: ${jmlDijawab})</span>
            <span id="kuis-timer" class="timer-badge">${teksTimer}</span>
          </div>
          <div class="nav-soal-grid">${gridNomor}</div>
          <p style="font-size:0.75rem; color:#64748b; margin-bottom:12px;">🟩 Hijau: Sudah dijawab • ⬜ Putih: Belum dijawab • 🔀 Soal Acak</p>
          ${blokVisualSoal}
          <p style="font-size:1rem; font-weight:600; margin-bottom:16px; line-height:1.5;">${esc(s.q)}</p>
          <div class="list-menu">
            ${s.p.map((pil, i) => {
              const terpilih = jawabanUser[idxSoal] === i ? "opt-selected" : "";
              const ikon = jawabanUser[idxSoal] === i ? "✅" : "";
              const urlImgOpsi = (Array.isArray(s.pImg) && s.pImg[i]) ? s.pImg[i] : "";
              const svgOpsi = (Array.isArray(s.pSvg) && s.pSvg[i]) ? s.pSvg[i] : "";
              const blokVisualOpsi = renderVisual(urlImgOpsi, svgOpsi, "opsi-img");
              return `<button type="button" class="list-item ${terpilih}" style="width:100%; text-align:left; align-items:flex-start;" onclick="pilihJawaban(${i})"><div><span><b style="color:#4f46e5; margin-right:6px;">${abjad[i]}.</b> ${esc(pil)}</span>${blokVisualOpsi}</div><span>${ikon}</span></button>`;
            }).join("")}
          </div>
          <div class="quiz-footer">${tombolSebelumnya}${tombolSelanjutnya}</div>
          ${idxSoal < soalList.length - 1 ? `<button type="button" class="btn-pdf" onclick="selesaiKuis(false)">🏁 Kumpulkan & Selesai Ujian</button>` : ""}
        </div>`;
    }

    function selesaiKuis(otomatis) {
      const belumDijawab = jawabanUser.filter(j => j === null).length;
      if (!otomatis && belumDijawab > 0) {
        if (!confirm(`Masih ada ${belumDijawab} soal yang belum dijawab. Yakin ingin menyelesaikan ujian sekarang?`)) return;
      }
      clearInterval(timer);

      let skor = 0;
      const riwayat = soalList.map((s, idx) => {
        const jwb = jawabanUser[idx];
        const ok = jwb === s.b;
        if (ok) skor++;
        const uImg = (jwb !== null && Array.isArray(s.pImg) && s.pImg[jwb]) ? s.pImg[jwb] : "";
        const uSvg = (jwb !== null && Array.isArray(s.pSvg) && s.pSvg[jwb]) ? s.pSvg[jwb] : "";
        const bImg = (Array.isArray(s.pImg) && s.pImg[s.b]) ? s.pImg[s.b] : "";
        const bSvg = (Array.isArray(s.pSvg) && s.pSvg[s.b]) ? s.pSvg[s.b] : "";
        return {
          q: s.q,
          visSoal: renderVisual(s.img, s.svg, "soal-img"),
          u: jwb !== null ? s.p[jwb] : "(Tidak Dijawab)",
          visU: renderVisual(uImg, uSvg, "opsi-img"),
          b: s.p[s.b],
          visB: renderVisual(bImg, bSvg, "opsi-img"),
          bahas: s.bahas || "Tidak ada pembahasan tambahan.",
          ok
        };
      });

      const nilai = Math.round((skor / soalList.length) * 100);
      const labelKelas = sesi.tipe === "sekolah" ? sesi.labelKelas : sesi.tipe.toUpperCase();
      const labelUjian = sesi.tipe === "sekolah"
        ? `${sesi.namaMapel} • Bab ${sesi.nomorBab} (${sesi.namaSesi})`
        : `${sesi.namaMapel} (${sesi.namaSesi})`;
      const waktuSelesai = new Date().toLocaleString("id-ID");

      const rekap = JSON.parse(localStorage.getItem("rim_rekap") || "[]");
      rekap.push({
        kode: sesi.kodeUjian,
        nama: sesi.nama,
        kelas: labelKelas,
        mapel: labelUjian,
        nilai: nilai,
        waktu: waktuSelesai
      });
      localStorage.setItem("rim_rekap", JSON.stringify(rekap));

      const aksiUlangi = sesi.tipe === "sekolah"
        ? `siapkanSesiSekolah(${sesi.nomorSesi}, '${sesi.namaSesi}')`
        : `siapkanSesiKhusus('${sesi.tipe}', ${sesi.nomorSesi}, '${sesi.namaSesi}')`;

      const aksiSesiLain = sesi.tipe === "sekolah"
        ? `pilihSesiSekolah(${sesi.nomorBab}, '${esc(sesi.namaBab)}')`
        : `pilihSesiTesKhusus('${sesi.tipe}', '${sesi.kodeMapel}', '${esc(sesi.namaMapel)}')`;

      app().innerHTML = `
        <div class="form-box" style="text-align:center; padding:24px 18px;">
          <span class="hero-badge" style="background:#dcfce7; color:#15803d;">✅ NILAI OTOMATIS DIREKAP</span>
          <h2 style="margin-top:8px;">${esc(sesi.namaSesi)} Selesai!</h2>
          <p style="margin-top:4px; color:#64748b; font-size:0.9rem;">
            Peserta: <b>${esc(sesi.nama)}</b><br>
            ${esc(labelKelas)} • ${esc(labelUjian)}

    function salinPerintahAI() {
      const kat = document.getElementById("adm-kategori").value;
      const selKelas = document.getElementById("adm-kelas");
      const selMapel = document.getElementById("adm-mapel");
      const kLabel = selKelas.options[selKelas.selectedIndex].text;
      const mLabel = selMapel.options[selMapel.selectedIndex].text;
      const b = document.getElementById("adm-bab").value;
      const s = document.getElementById("adm-sesi").value;
      const konteks = dataPendidikan[kat] ? `${kLabel} Bab ${b} Sesi ${s}` : `${kLabel} Sesi ${s}`;
      const topik = document.getElementById("ai-topik").value.trim() || `${mLabel} (${konteks})`;
      const jml = document.getElementById("ai-jumlah").value;
      const modeGbr = document.getElementById("ai-mode-gambar").value;

      let instruksiGambar = `[{"q":"Pertanyaan soal?","p":["Opsi A","Opsi B","Opsi C","Opsi D"],"b":0,"bahas":"Penjelasan singkat"}]`;
      if (modeGbr === "gambar-soal") {
        instruksiGambar = `[{"q":"Perhatikan gambar berikut! Pertanyaan soal?","svg":"<svg width='240' height='140' viewBox='0 0 240 140' xmlns='http://w3.org'>...</svg>","p":["Opsi A","Opsi B","Opsi C","Opsi D"],"b":0,"bahas":"Penjelasan singkat"}]\nInstruksi SVG: Buat kode SVG vektor sederhana, jelas, berwarna, dan lengkap pada properti "svg".`;
      } else if (modeGbr === "gambar-opsi") {
        instruksiGambar = `[{"q":"Pertanyaan soal?","svg":"<svg width='220' height='120' viewBox='0 0 220 120' xmlns='http://w3.org'>...</svg>","p":["Label A","Label B","Label C","Label D"],"pSvg":["<svg width='110' height='80' viewBox='0 0 110 80' xmlns='http://w3.org'>...</svg>","<svg ...>...</svg>","<svg ...>...</svg>","<svg ...>...</svg>"],"b":0,"bahas":"Penjelasan singkat"}]\nInstruksi SVG: Buat kode SVG vektor pada "svg" dan "pSvg" (4 kode SVG untuk masing-masing opsi A, B, C, D).`;
      }

      const teks = `Buatkan ${jml} soal pilihan ganda standar Kurikulum 2026/2027 untuk ${konteks} bidang ${mLabel} topik "${topik}". Berikan jawaban HANYA dalam format JSON array murni seperti contoh ini tanpa teks pembuka/penutup:\n${instruksiGambar}\nCatatan: "b" adalah indeks jawaban benar (0=A, 1=B, 2=C, 3=D). Pastikan tanda kutip di dalam SVG memakai petik tunggal (') agar JSON valid.`;
      navigator.clipboard.writeText(teks).then(() => alert("✅ Perintah AI disalin! Tempel di AI, lalu tempel hasilnya di kotak nomor 2.")).catch(() => prompt("Salin perintah ini:", teks));
    }

    function susunKodeFileJS() {
      const kat = document.getElementById("adm-kategori").value;
      const k = document.getElementById("adm-kelas").value;
      const m = document.getElementById("adm-mapel").value;
      const b = document.getElementById("adm-bab").value;
      const s = document.getElementById("adm-sesi").value;
      const namaFile = dataPendidikan[kat]
        ? buatNamaFileSoalSekolah(k, m, b, s)
        : buatNamaFileSoalKhusus(kat, m, s);

      let mentah = document.getElementById("ai-json-hasil").value.trim();
      if (!mentah) return alert("Tempelkan hasil JSON dari AI terlebih dahulu!");

      try {
        const awal = mentah.indexOf("["), akhir = mentah.lastIndexOf("]");
        if (awal !== -1 && akhir !== -1) mentah = mentah.slice(awal, akhir + 1);
        const arr = JSON.parse(mentah);
        if (!Array.isArray(arr) || arr.length === 0) throw new Error("Kosong");

        const objekSoalStr = arr.map((item, idx) => `  // Soal ${idx + 1}\n  ${JSON.stringify(item)}`).join(",\n\n");
        const kodeLengkap = `// File: soal/${namaFile}\n// Tambah soal baru cukup tempel di bagian paling bawah sebelum tanda ];\nwindow.BANK_SOAL_AKTIF = [\n${objekSoalStr}\n];`;

        document.getElementById("label-file-output").innerText = `soal/${namaFile}`;
        document.getElementById("out-kode-github").value = kodeLengkap;
        navigator.clipboard.writeText(kodeLengkap).then(() => {
          alert(`✅ ${arr.length} soal disusun & disalin otomatis!\n\nSimpan dengan nama file: soal/${namaFile} di GitHub Anda.`);
        }).catch(() => alert("✅ Kode berhasil disusun di kotak bawah!"));
      } catch (e) {
        alert("❌ Format JSON dari AI belum valid. Pastikan menyalin mulai dari tanda [ sampai ].");
      }
    }

    function dapatkanRekapTersaring(idKode, idKelas, idMapel) {
      const data = JSON.parse(localStorage.getItem("rim_rekap") || "[]");
      const fKode = document.getElementById(idKode).value;
      const fKelas = document.getElementById(idKelas).value;
      const fMapel = document.getElementById(idMapel).value;
      return data.filter(d => {
        const kdItem = String(d.kode || "TANPA-KODE").trim();
        const klsItem = String(d.kelas || "-").trim();
        const mplItem = String(d.mapel || "-").trim();
        return (fKode === "SEMUA" || kdItem === fKode) && (fKelas === "SEMUA" || klsItem === fKelas) && (fMapel === "SEMUA" || mplItem === fMapel);
      });
    }

    function renderIsiRekapTerfilter() {
      const hasil = dapatkanRekapTersaring("rek-filter-kode", "rek-filter-kelas", "rek-filter-mapel");
      const wadah = document.getElementById("wadah-hasil-rekap");
      if (!wadah) return;
      if (hasil.length === 0) {
        wadah.innerHTML = `<p style="color:#64748b; font-size:0.88rem; text-align:center;">Belum ada data nilai pada filter yang dipilih.</p>`;
        return;
      }
      const listHtml = hasil.map((d, i) => `
        <div style="border-bottom:1px solid #e2e8f0; padding:10px 0; font-size:0.88rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
            <b>${i + 1}. ${esc(d.nama)}</b>
            <span class="kode-pill">🔑 ${esc(d.kode || "TANPA-KODE")}</span>
          </div>
          <small style="color:#64748b;">${esc(d.kelas)} ${d.waktu ? "• " + esc(d.waktu) : ""}</small><br>
          Ujian: <b>${esc(d.mapel)}</b> • Skor: <b style="color:#4f46e5; font-size:1rem;">${d.nilai}</b>
        </div>`).join("");

      wadah.innerHTML = `
        <h4 style="font-size:0.92rem; color:#4f46e5; margin-bottom:6px;">Menampilkan ${hasil.length} Peserta</h4>
        ${listHtml}
        <button type="button" class="btn-pdf" onclick="eksekusiUnduhPDF('rek-filter-kode','rek-filter-kelas','rek-filter-mapel')">🖨️ Cetak / Download PDF Hasil Filter Ini</button>
        <button type="button" class="btn-danger" onclick="hapusRekapTerfilter()">🧹 Hapus Data Hasil Filter Ini</button>`;
    }

    function hapusRekapTerfilter() {
      const fKode = document.getElementById("rek-filter-kode").value;
      const fKelas = document.getElementById("rek-filter-kelas").value;
      const fMapel = document.getElementById("rek-filter-mapel").value;
      const hasil = dapatkanRekapTersaring("rek-filter-kode", "rek-filter-kelas", "rek-filter-mapel");
      if (!confirm(`Yakin ingin menghapus ${hasil.length} data nilai yang sedang ditampilkan ini?`)) return;

      const data = JSON.parse(localStorage.getItem("rim_rekap") || "[]");
      const sisa = data.filter(d => {
        const kdItem = String(d.kode || "TANPA-KODE").trim();
        const klsItem = String(d.kelas || "-").trim();
        const mplItem = String(d.mapel || "-").trim();
        const cocok = (fKode === "SEMUA" || kdItem === fKode) && (fKelas === "SEMUA" || klsItem === fKelas) && (fMapel === "SEMUA" || mplItem === fMapel);
        return !cocok;
      });
      localStorage.setItem("rim_rekap", JSON.stringify(sisa));
      tampilkanRekapTerfilter();
    }
