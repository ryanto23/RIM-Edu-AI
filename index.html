function escapeHTML(str) {
return String(str).replace(/[&<>'"]/g, function(tag) {
const chars = { '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' };
return chars[tag] || tag;
});
}
function ambilTeksGemini(data) {
if (data && data.candidates && data.candidates.length > 0) {
const kandidat = data.candidates.at(0);
if (kandidat.content && kandidat.content.parts && kandidat.content.parts.length > 0) {
return kandidat.content.parts.at(0).text || "";
}
}
return "";
}

function ambilApiKey() {
return localStorage.getItem("rim_gemini_key") || GEMINI_API_KEY;
}
function aturApiKey() {
const currentKey = localStorage.getItem("rim_gemini_key") || "";
const newKey = prompt("Masukkan Google Gemini API Key Anda:", currentKey);
if (newKey !== null) {
localStorage.setItem("rim_gemini_key", newKey.trim());
alert("API Key berhasil disimpan di browser!");
}
}
async function kirimPertanyaanAI() {
const inputEl = document.getElementById("ai-input");
const chatHistory = document.getElementById("chat-history");
const pertanyaan = inputEl.value.trim();
if (!pertanyaan) return;
chatHistory.innerHTML += <div class="chat-msg chat-user">${escapeHTML(pertanyaan)}</div>;
inputEl.value = "";
chatHistory.scrollTop = chatHistory.scrollHeight;
const loadingId = "loading-" + Date.now();
chatHistory.innerHTML += <div id="${loadingId}" class="chat-msg chat-ai"><em>Sedang berpikir...</em></div>;
chatHistory.scrollTop = chatHistory.scrollHeight;
const savedKey = ambilApiKey();
if (!savedKey || savedKey === "MASUKKAN_API_KEY_GEMINI_ANDA_DISINI") {
document.getElementById(loadingId).innerHTML =
"⚠️ API Key belum diatur. Masuk ke menu Saya > Atur API Key Gemini AI terlebih dahulu.";
return;
}
try {
const response = await fetch(https://googleapis.com{GEMINI_MODEL}:generateContent?key=${savedKey}, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
contents: [{
parts: [{
text: Kamu adalah guru tutor Kurikulum Merdeka di Indonesia yang ramah dan jelas. Jawab pertanyaan siswa ini dengan bahasa yang mudah dipahami:\n\n${pertanyaan}
}]
}]
})
});
const data = await response.json();
if (data.error) throw new Error(data.error.message);
const jawabanAI = ambilTeksGemini(data) || "Maaf, AI tidak dapat menjawab saat ini.";
document.getElementById(loadingId).innerHTML = jawabanAI.replace(/\n/g, "
");
} catch (error) {
document.getElementById(loadingId).innerHTML = ❌ Gagal terhubung ke server AI: ${error.message};
}
chatHistory.scrollTop = chatHistory.scrollHeight;
}

async function buatSoalOtomatisAI() {
const savedKey = ambilApiKey();
const { jenjang, kelasTingkat, mapel, bab, nama, kelasInput } = sesiSiswa;

Buatkan 5 soal latihan pilihan ganda sesuai Kurikulum Merdeka Indonesia dengan detail berikut:
• Jenjang: ${jenjang.toUpperCase()}

• Mata Pelajaran: ${mapel}

[
{
"pertanyaan": "Teks pertanyaan soal di sini",
"pilihan": ["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"],
"jawabanBenar": 0,
"pembahasan": "Penjelasan singkat mengapa jawaban tersebut benar"
}
]

`;

headers: { "Content-Type": "application/json" },

contents: [{ parts: [{ text: promptSoal }] }],

}

});

const rawText = ambilTeksGemini(data) || "[]";

if (!Array.isArray(soalAktifList) || soalAktifList.length === 0) {
throw new Error("Format soal dari AI kosong atau tidak valid.");
}
soalSekarang = 0;
skorTotal = 0;
riwayatJawabanUser = [];
mulaiTimer(300);
tampilkanSoalKuis();

function mulaiTimer(durasiDetik) {
clearInterval(timerInterval);
waktuTersisa = durasiDetik;

waktuTersisa--;
const timerEl = document.getElementById("quiz-timer");
if (timerEl) {
const menit = Math.floor(waktuTersisa / 60);
const detik = waktuTersisa % 60;
timerEl.innerText = ⏱️ ${menit}:${detik < 10 ? "0" : ""}${detik};

    dataRekap.forEach(function(row, i) {
