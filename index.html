<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIM CBT - Sistem Evaluasi Kurikulum 2026/2027</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root { --primary: #4f46e5; --accent: #f59e0b; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 95px; }
    header { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); color: var(--primary); padding: 16px; text-align: center; font-weight: 800; font-size: 1.2rem; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); }
    #app-content { max-width: 560px; margin: 18px auto; padding: 0 16px; }
    .hero-card { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 24px 20px; border-radius: 18px; margin-bottom: 14px; }
    .hero-badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
    .hero-card h2 { margin-bottom: 8px; font-size: 1.35rem; font-weight: 800; }
    .hero-card p { font-size: 0.9rem; line-height: 1.5; opacity: 0.95; }
    .form-box { background: var(--surface); padding: 18px; border-radius: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
    .quote-box { background: var(--surface); border-left: 4px solid var(--accent); padding: 14px 16px; border-radius: 12px; margin-bottom: 14px; }
    .quote-box p { font-style: italic; color: #334155; font-size: 0.9rem; line-height: 1.5; margin-bottom: 4px; }
    .quote-box small { color: var(--muted); font-weight: 700; font-size: 0.78rem; }
    .btn-primary { background: #4f46e5; color: #fff; border: none; padding: 13px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.95rem; width: 100%; }
    .btn-pdf { background: #16a34a; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; width: 100%; margin-top: 10px; }
    .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 11px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.88rem; width: 100%; margin-top: 8px; }
    .btn-back { background: #f1f5f9; color: #475569; border: none; padding: 7px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 12px; font-weight: 700; font-size: 0.82rem; }
    input, select, textarea { width: 100%; padding: 11px 13px; margin: 5px 0 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.92rem; background: #f8fafc; }
    label { font-size: 0.82rem; font-weight: 700; color: #334155; display: block; }
    .list-menu { display: flex; flex-direction: column; gap: 10px; }
    .list-item { background: var(--surface); padding: 14px 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1.5px solid var(--border); font-size: 0.94rem; font-weight: 600; color: var(--text); transition: all 0.15s ease; }
    .list-item:hover { border-color: var(--primary); background: #eef2ff; }
    .timer-badge { background: #fef2f2; color: #dc2626; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; border: 1px solid #fecaca; }
    .nav-soal-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .num-box { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .num-box.answered { background: #dcfce7; border-color: #16a34a; color: #15803d; }
    .num-box.current { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .opt-selected { border-color: #4f46e5 !important; background: #eef2ff !important; }
    .quiz-footer { display: flex; gap: 10px; margin-top: 16px; }
    .soal-img { max-width: 100%; max-height: 240px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: block; object-fit: contain; background: #f8fafc; }
    .opsi-img { max-width: 180px; max-height: 120px; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; display: block; object-fit: contain; background: #fff; }
    .kode-pill { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 6px; font-size: 0.74rem; font-weight: 800; }
    .sync-bar { font-size: 0.75rem; text-align: center; padding: 6px; background: #dcfce7; color: #15803d; font-weight: 700; }
    .bottom-nav { position: fixed; bottom: 12px; left: 16px; right: 16px; max-width: 528px; margin: 0 auto; background: rgba(255,255,255,0.95); display: flex; justify-content: space-around; border: 1px solid var(--border); border-radius: 20px; padding: 8px 4px; z-index: 30; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 0.72rem; font-weight: 600; color: var(--muted); cursor: pointer; padding: 6px 12px; border-radius: 14px; }
    .nav-item.active { color: var(--primary); background: #eef2ff; font-weight: 800; }
    .nav-item span { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>

  <main id="app-content"></main>
  <nav class="bottom-nav">

  </nav>

    <script>
    window.BANK_SOAL_AKTIF = [];

    const dataPendidikan = {
      sd: {
        judul: "Sekolah Dasar (SD)",
        kelas: [
          { nomor: 1, label: "Kelas 1" },

        ]

          { nomor: 7, label: "Kelas 7" },

        ],
        mapel: [

          { kode: "bind", nama: "Bahasa Indonesia" },
          { kode: "bing", nama: "Bahasa Inggris" },
          { kode: "ipa", nama: "IPA" },
          { kode: "ips", nama: "IPS" },
          { kode: "pancasila", nama: "Pendidikan Pancasila" },
          { kode: "informatika", nama: "Informatika & KKA" }

        kelas: [
          { nomor: 10, label: "Kelas 10" },

          { nomor: 12, label: "Kelas 12" }
        ],
        mapel: [

          { kode: "bind", nama: "Bahasa Indonesia" },
          { kode: "bing", nama: "Bahasa Inggris" },

          { kode: "kimia", nama: "Kimia" },

    const daftarSesiUjian = [
      { nomor: 1, nama: "Sesi 1", ket: "Evaluasi Tahap 1 • 20 Soal Pilihan Ganda (Acak)" },
      { nomor: 2, nama: "Sesi 2", ket: "Evaluasi Tahap 2 • 20 Soal Pilihan Ganda (Acak)" },

    const soalContohPerMapel = {
      "mtk": { q: "Hasil operasi hitung dari 15 + 25 x 2 adalah ...", p: ["80", "65", "55", "40"], b: 1, bahas: "Perkalian didahulukan: 25 x 2 = 50, lalu 15 + 50 = 65." },
      "bind": { q: "Inti pembicaraan utama dalam sebuah paragraf disebut ...", p: ["Gagasan pokok", "Kalimat penjelas", "Kata penghubung", "Judul bacaan"], b: 0, bahas: "Gagasan pokok merupakan ide utama yang mendasari paragraf." },
      "bing": { q: "She ... to school by bicycle every morning.", p: ["go", "goes", "going", "went"], b: 1, bahas: "Subjek orang ketiga tunggal (She) pada Simple Present memakai akhiran -es (goes)." },
      "ipas": { q: "Proses tumbuhan membuat makanan sendiri dengan bantuan cahaya matahari disebut ...", p: ["Respirasi", "Fotosintesis", "Adaptasi", "Transpirasi"], b: 1, bahas: "Fotosintesis berlangsung di daun yang memiliki klorofil." },
      "ipa": { q: "Satuan Internasional (SI) untuk besaran suhu adalah ...", p: ["Celcius", "Fahrenheit", "Kelvin", "Reamur"], b: 2, bahas: "Kelvin (K) merupakan satuan standar SI untuk suhu." },
      "ips": { q: "Kebutuhan manusia tidak terbatas sedangkan alat pemuas terbatas disebut ...", p: ["Kelangkaan", "Inflasi", "Distribusi", "Konsumsi"], b: 0, bahas: "Kelangkaan adalah inti permasalahan dalam ilmu ekonomi." },
      "pancasila": { q: "Lambang sila keempat Pancasila adalah ...", p: ["Bintang", "Rantai emas", "Pohon beringin", "Kepala banteng"], b: 3, bahas: "Kepala banteng melambangkan semangat musyawarah mufakat." },
      "kka": { q: "Urutan langkah logis dan sistematis untuk menyelesaikan masalah disebut ...", p: ["Algoritma", "Perangkat keras", "Peramban", "Basis data"], b: 0, bahas: "Algoritma adalah instruksi berurutan untuk memecahkan persoalan." },
      "informatika": { q: "Teknik memecah masalah besar menjadi bagian kecil yang mudah dikelola disebut ...", p: ["Dekomposisi", "Abstraksi", "Enkripsi", "Kompilasi"], b: 0, bahas: "Dekomposisi adalah pilar utama berpikir komputasional." },
      "fisika": { q: "Besaran berikut yang termasuk kelompok besaran pokok adalah ...", p: ["Kecepatan dan gaya", "Panjang, massa, dan waktu", "Luas dan volume", "Usaha dan daya"], b: 1, bahas: "Panjang, massa, dan waktu termasuk 7 besaran pokok SI." },
      "kimia": { q: "Rumus kimia untuk molekul air murni adalah ...", p: ["CO2", "H2O", "O2", "NaCl"], b: 1, bahas: "Air tersusun atas 2 atom Hidrogen dan 1 atom Oksigen." },
      "biologi": { q: "Organel sel yang berfungsi sebagai pusat pengendali seluruh aktivitas sel adalah ...", p: ["Nukleus (Inti sel)", "Dinding sel", "Vakuola", "Sitoplasma"], b: 0, bahas: "Nukleus mengatur metabolisme dan menyimpan materi genetik." },
      "ekonomi": { q: "Hukum permintaan menyatakan jika harga barang naik, maka jumlah permintaan akan ...", p: ["Naik", "Turun", "Tetap", "Berlipat ganda"], b: 1, bahas: "Harga dan jumlah barang yang diminta berbanding terbalik." }
    };

          function acakArray(arr) {
      const hasil = [...arr];
      for (let i = hasil.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [hasil[i], hasil[j]] = [hasil[j], hasil[i]];
      }
      return hasil;
    }

    function siapkanSoalAcak(daftarMentah, maksimalSoal = 20) {
      const soalTeracak = acakArray(daftarMentah).slice(0, maksimalSoal);
      return soalTeracak.map((item) => {
        const indeksOpsi = item.p.map((_, idx) => idx);
        const indeksOpsiAcak = acakArray(indeksOpsi);

        const pBaru = indeksOpsiAcak.map(idx => item.p[idx]);
        const bBaru = indeksOpsiAcak.indexOf(item.b);
        const pImgBaru = Array.isArray(item.pImg) ? indeksOpsiAcak.map(idx => item.pImg[idx] || "") : undefined;
        const pSvgBaru = Array.isArray(item.pSvg) ? indeksOpsiAcak.map(idx => item.pSvg[idx] || "") : undefined;

        return {
          ...item,
          p: pBaru,
          b: bBaru,
          ...(pImgBaru ? { pImg: pImgBaru } : {}),
          ...(pSvgBaru ? { pSvg: pSvgBaru } : {})
        };
      });
    }

    function buatNamaFileSoal(nomorKelas, kodeMapel, nomorSesi) {
      return `kls${nomorKelas}_${kodeMapel}_sesi${nomorSesi}.js`;
    }

    function muatFileSoalSesi(nomorKelas, kodeMapel, nomorSesi) {
      return new Promise((resolve) => {
        window.BANK_SOAL_AKTIF = [];
        const namaFile = buatNamaFileSoal(nomorKelas, kodeMapel, nomorSesi);
        const pathFile = `./soal/${namaFile}`;
        const statusEl = document.getElementById("sync-status");

        const lama = document.getElementById("script-soal-sesi");
        if (lama) lama.remove();

        const s = document.createElement("script");
        s.id = "script-soal-sesi";
        s.src = `${pathFile}?v=${Date.now()}`;
        s.onload = () => {
          const daftar = Array.isArray(window.BANK_SOAL_AKTIF) ? window.BANK_SOAL_AKTIF : [];
          if (daftar.length > 0) {
            statusEl.style.background = "#dcfce7";
            statusEl.style.color = "#15803d";
            statusEl.innerText = `🟢 File soal/${namaFile} termuat (${daftar.length} soal • Mode Acak Aktif)`;
            resolve({ tersedia: true, namaFile, soal: daftar });
          } else {
            statusEl.style.background = "#fef3c7";
            statusEl.style.color = "#92400e";
            statusEl.innerText = `⚠️ File soal/${namaFile} masih kosong • Menggunakan soal contoh`;
            resolve({ tersedia: false, namaFile, soal: buatFallback20Soal(nomorKelas, kodeMapel, nomorSesi, namaFile) });
          }
        };
        s.onerror = () => {
          statusEl.style.background = "#fef3c7";
          statusEl.style.color = "#92400e";
          statusEl.innerText = `⚠️ File soal/${namaFile} belum dibuat di GitHub • Menampilkan simulasi`;
          resolve({ tersedia: false, namaFile, soal: buatFallback20Soal(nomorKelas, kodeMapel, nomorSesi, namaFile) });
        };
        document.body.appendChild(s);
      });
    }

    function buatFallback20Soal(nomorKelas, kodeMapel, nomorSesi, namaFile) {
      const dasar = soalContohPerMapel[kodeMapel] || soalContohPerMapel["mtk"];
      return Array.from({ length: 20 }, (_, i) => ({
        ...dasar,
        q: `[Simulasi Soal ${i + 1} • Upload soal/${namaFile}] ${dasar.q}`
      }));
    }

    let timer, bankSoalMentah = [], soalList = [], jawabanUser = [], idxSoal = 0, sisaWaktu = 0;
    let adminTerbuka = false;
    let sesi = {
      nama: "", sekolah: "", kelasInput: "", kodeUjian: "",
      jenjang: "", nomorKelas: 1, labelKelas: "",
      kodeMapel: "", namaMapel: "", nomorSesi: 1, namaSesi: "", namaFile: ""
    };

    const app = () => document.getElementById("app-content");
    const title = () => document.getElementById("header-title");
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    function dapatkanPinAdmin() {
      return localStorage.getItem("rim_admin_pin") || "123456";
    }

    function ubahPinAdmin() {
      const baru = (prompt("Masukkan Password / PIN Admin baru (minimal 4 karakter):") || "").trim();
      if (!baru) return;
      if (baru.length < 4) return alert("Password minimal 4 karakter!");
      localStorage.setItem("rim_admin_pin", baru);
      alert("✅ Password / PIN Admin berhasil diperbarui!");
    }

    function bukaMenu(menu) {
      clearInterval(timer);
      if (menu !== "saya") adminTerbuka = false;
      document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.menu === menu));

      if (menu === "home") {
        title().innerText = "RIM CBT";
        document.getElementById("sync-status").style.background = "#dcfce7";
        document.getElementById("sync-status").style.color = "#15803d";
        document.getElementById("sync-status").innerText = "🟢 Bank Soal GitHub • Kurikulum 2026/2027 Siap Digunakan";
        app().innerHTML = `
          <div class="hero-card">
            <span class="hero-badge">KURIKULUM MERDEKA • CBT</span>
            <h2>Selamat Datang di RIM CBT</h2>
            <p>Pilih jenjang pendidikanmu (SD, SMP, atau SMA) untuk mengakses evaluasi <b>Sesi 1</b>, <b>Sesi 2</b>, dan <b>Sesi 3</b> sesuai mata pelajaran masing-masing kelas.</p>
          </div>
          <div class="quote-box">
            <p>"Jangan pernah berhenti belajar, karena hidup tak pernah berhenti mengajarkan hal baru."</p>
            <small>— Motivasi Belajar</small>
          </div>`;
      } else if (dataPendidikan[menu]) {
        pilihKelas(menu);

          if (pinInput === null) return bukaMenu("home");

            return bukaMenu("home");
          }

        title().innerText = "Panel Admin & Rekap";
        app().innerHTML = `

            <h3 style="font-size:1.05rem; margin-bottom:4px;">🔐 Area Admin & Generator File Soal</h3>
            <p style="font-size:0.84rem; color:#64748b;">Buat file soal modular (<b>kls1_mtk_sesi1.js</b> s/d <b>kls12</b>) atau lihat rekap nilai ujian siswa.</p>
          </div>
          <div class="list-menu">
            <div class="list-item" onclick="bukaGeneratorAI()" style="border-color:#4f46e5; background:#eef2ff;"><span>✨ Generator File Soal Sesi (.js) ➔ GitHub</span><span>➔</span></div>
            <div class="list-item" onclick="tampilkanRekapTerfilter()" style="border-color:#16a34a; background:#f0fdf4;"><span>📊 Lihat & Filter Rekap Nilai Siswa</span><span>➔</span></div>
            <div class="list-item" onclick="bukaModalPDF()"><span>📄 Download Rekap Nilai (PDF)</span><span>➔</span></div>

          function pilihKelas(jenjang) {
      const d = dataPendidikan[jenjang];
      title().innerText = d.judul;
      sesi.jenjang = jenjang;

          <h3 style="font-size:1.05rem;">Pilih Tingkat Kelas</h3>
          <p style="font-size:0.84rem; color:#64748b;">${d.judul} • Kurikulum 2026/2027</p>
        </div>

        d.kelas.map(k => `

            <span>➔</span>

    }

    function pilihMapel(jenjang, nomorKelas, labelKelas) {
      sesi.jenjang = jenjang;

        <div class="list-menu">` +
        dataPendidikan[jenjang].mapel.map(m => `

    function pilihSesiUjian(kodeMapel, namaMapel) {
      sesi.kodeMapel = kodeMapel;
      sesi.namaMapel = namaMapel;
      title().innerText = `${sesi.labelKelas} • ${namaMapel}`;
      app().innerHTML = `
        <div class="form-box">
          <button class="btn-back" onclick="pilihMapel('${sesi.jenjang}', ${sesi.nomorKelas}, '${sesi.labelKelas}')">⬅ Kembali ke Daftar Mapel</button>
          <h3 style="font-size:1.05rem;">Pilih Sesi Ujian</h3>
          <p style="font-size:0.84rem; color:#64748b;">${sesi.labelKelas} • <b>${esc(namaMapel)}</b> (Masing-masing 20 Soal PG Acak)</p>
        </div>
        <div class="list-menu">` +
        daftarSesiUjian.map(s => {
          const namaFile = buatNamaFileSoal(sesi.nomorKelas, kodeMapel, s.nomor);
          return `

    function mulaiKuis() {
      const kodeInput = document.getElementById("inp-kode-ujian").value.trim().toUpperCase();
      const nama = document.getElementById("inp-nama").value.trim();
      const sekolah = document.getElementById("inp-sekolah").value.trim();
      const kelas = document.getElementById("inp-kelas").value.trim();

      if (!nama || !sekolah || !kelas) {
        return alert("Lengkapi Nama Lengkap, Asal Sekolah, dan Kelas Spesifik terlebih dahulu!");
      }

      sesi.kodeUjian = kodeInput || `KLS${sesi.nomorKelas}-${sesi.kodeMapel.toUpperCase()}-S${sesi.nomorSesi}`;
      sesi.nama = nama;
      sesi.sekolah = sekolah;
      sesi.kelasInput = kelas;

      soalList = siapkanSoalAcak(bankSoalMentah, 20);
      jawabanUser = new Array(soalList.length).fill(null);
      idxSoal = 0;
      sisaWaktu = 45 * 60;

      clearInterval(timer);
      timer = setInterval(() => {
        const t = document.getElementById("kuis-timer");
        sisaWaktu--;
        if (t) t.innerText = `⏱️ ${Math.floor(sisaWaktu / 60)}:${String(sisaWaktu % 60).padStart(2, "0")}`;
        if (sisaWaktu <= 0) {
          clearInterval(timer);
          alert("Waktu ujian telah habis! Jawaban otomatis dikumpulkan.");
          selesaiKuis(true);
        }
      }, 1000);

      renderSoal();
    }

      jawabanUser[idxSoal] = i;

          <div style="display:flex; gap:8px; flex-direction:column;">
            <button class="btn-primary" onclick="siapkanSesi(${sesi.nomorSesi}, '${sesi.namaSesi}')">🔄 Ulangi ${sesi.namaSesi} (Soal Diacak Baru)</button>
            <button class="btn-primary" style="background:#0ea5e9;" onclick="pilihSesiUjian('${sesi.kodeMapel}', '${esc(sesi.namaMapel)}')">📝 Pilih Sesi Lainnya</button>

    function salinPerintahAI() {
      const selKelas = document.getElementById("adm-kelas");

        instruksiGambar = `[{"q":"Perhatikan gambar berikut! Pertanyaan soal?","svg":"<svg width='240' height='140' viewBox='0 0 240 140' xmlns='http://w3.org'>...</svg>","p":["Opsi A","Opsi B","Opsi C","Opsi D"],"b":0,"bahas":"Penjelasan singkat"}]\nInstruksi SVG: Buat kode SVG vektor sederhana, jelas, berwarna, dan lengkap pada properti "svg".`;

    function susunKodeFileJS() {
      const k = document.getElementById("adm-kelas").value;
      const m = document.getElementById("adm-mapel").value;
      const s = document.getElementById("adm-sesi").value;
      const namaFile = buatNamaFileSoal(k, m, s);

      let mentah = document.getElementById("ai-json-hasil").value.trim();
      if (!mentah) return alert("Tempelkan hasil JSON dari AI terlebih dahulu!");

      try {
        const awal = mentah.indexOf("["), akhir = mentah.lastIndexOf("]");
        if (awal !== -1 && akhir !== -1) mentah = mentah.slice(awal, akhir + 1);
        const arr = JSON.parse(mentah);
        if (!Array.isArray(arr) || arr.length === 0) throw new Error("Kosong");

        const objekSoalStr = arr.map((item, idx) => `  // Soal ${idx + 1}\n  ${JSON.stringify(item)}`).join(",\n\n");
        const kodeLengkap = `// File: soal/${namaFile}\n// Tambah soal baru cukup tempel di bagian paling bawah sebelum tanda ];\nwindow.BANK_SOAL_AKTIF = [\n${objekSoalStr}\n];`;

        document.getElementById("label-file-output").innerText = `soal/${namaFile}`;
        document.getElementById("out-kode-github").value = kodeLengkap;
        navigator.clipboard.writeText(kodeLengkap).then(() => {
          alert(`✅ ${arr.length} soal disusun & disalin otomatis!\n\nSimpan dengan nama file: soal/${namaFile} di GitHub Anda.`);
        }).catch(() => alert("✅ Kode berhasil disusun di kotak bawah!"));
      } catch (e) {
        alert("❌ Format JSON dari AI belum valid. Pastikan menyalin mulai dari tanda [ sampai ].");
      }
    }

        const klsItem = String(d.kelas || "-").trim();
        const mplItem = String(d.mapel || "-").trim();
        return (fKode === "SEMUA" || kdItem === fKode) && (fKelas === "SEMUA" || klsItem === fKelas) && (fMapel === "SEMUA" || mplItem === fMapel);
      });
    }

    function renderIsiRekapTerfilter() {
      const hasil = dapatkanRekapTersaring("rek-filter-kode", "rek-filter-kelas", "rek-filter-mapel");
      const wadah = document.getElementById("wadah-hasil-rekap");
      if (!wadah) return;
      if (hasil.length === 0) {
        wadah.innerHTML = `<p style="color:#64748b; font-size:0.88rem; text-align:center;">Belum ada data nilai pada filter yang dipilih.</p>`;
        return;
      }
      const listHtml = hasil.map((d, i) => `
        <div style="border-bottom:1px solid #e2e8f0; padding:10px 0; font-size:0.88rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
            <b>${i + 1}. ${esc(d.nama)}</b>
            <span class="kode-pill">🔑 ${esc(d.kode || "TANPA-KODE")}</span>
          </div>
          <small style="color:#64748b;">${esc(d.sekolah)} • Kelas ${esc(d.kelas)} ${d.waktu ? "• " + esc(d.waktu) : ""}</small><br>
          Ujian: <b>${esc(d.mapel)}</b> • Skor: <b style="color:#4f46e5; font-size:1rem;">${d.nilai}</b>
        </div>`).join("");

      wadah.innerHTML = `
        <h4 style="font-size:0.92rem; color:#4f46e5; margin-bottom:6px;">Menampilkan ${hasil.length} Peserta</h4>
        ${listHtml}
        <button type="button" class="btn-pdf" onclick="eksekusiUnduhPDF('rek-filter-kode','rek-filter-kelas','rek-filter-mapel')">🖨️ Cetak / Download PDF Hasil Filter Ini</button>
        <button type="button" class="btn-danger" onclick="hapusRekapTerfilter()">🧹 Hapus Data Hasil Filter Ini</button>`;
    }

    function hapusRekapTerfilter() {
      const fKode = document.getElementById("rek-filter-kode").value;
      const fKelas = document.getElementById("rek-filter-kelas").value;
      const fMapel = document.getElementById("rek-filter-mapel").value;
      const hasil = dapatkanRekapTersaring("rek-filter-kode", "rek-filter-kelas", "rek-filter-mapel");
      if (!confirm(`Yakin ingin menghapus ${hasil.length} data nilai yang sedang ditampilkan ini?`)) return;

      const data = JSON.parse(localStorage.getItem("rim_rekap") || "[]");
      const sisa = data.filter(d => {
        const kdItem = String(d.kode || "TANPA-KODE").trim();
        const klsItem = String(d.kelas || "-").trim();
        const mplItem = String(d.mapel || "-").trim();
        const cocok = (fKode === "SEMUA" || kdItem === fKode) && (fKelas === "SEMUA" || klsItem === fKelas) && (fMapel === "SEMUA" || mplItem === fMapel);
        return !cocok;
      });
      localStorage.setItem("rim_rekap", JSON.stringify(sisa));
      tampilkanRekapTerfilter();
    }

    function bukaModalPDF() {
      const data = JSON.parse(localStorage.getItem("rim_rekap") || "[]");
      if (data.length === 0) return alert("Belum ada data nilai untuk diunduh!");
      const daftarKode = ["SEMUA", ...new Set(data.map(d => String(d.kode || "TANPA-KODE").trim()))];
      const daftarKelas = ["SEMUA", ...new Set(data.map(d => String(d.kelas || "-").trim()))];
      const daftarMapel = ["SEMUA", ...new Set(data.map(d => String(d.mapel || "-").trim()))];
      app().innerHTML = `
        <div class="form-box">
          <button class="btn-back" onclick="bukaMenu('saya')">⬅ Kembali</button>
          <h3 style="font-size:1.05rem; margin-bottom:6px;">📄 Download Rekap Nilai (PDF)</h3>
          <label>🔑 Filter Kode Ujian</label><select id="pdf-filter-kode">${daftarKode.map(kd => `<option value="${esc(kd)}">${kd === "SEMUA" ? "Semua Kode Ujian" : "Kode: " + esc(kd)}</option>`).join("")}</select>
          <label>Filter Kelas</label><select id="pdf-filter-kelas">${daftarKelas.map(k => `<option value="${esc(k)}">${k === "SEMUA" ? "Semua Kelas" : "Kelas " + esc(k)}</option>`).join("")}</select>
          <label>Filter Mata Pelajaran & Sesi</label><select id="pdf-filter-mapel">${daftarMapel.map(m => `<option value="${esc(m)}">${m === "SEMUA" ? "Semua Mapel & Sesi" : esc(m)}</option>`).join("")}</select>
          <button type="button" class="btn-pdf" onclick="eksekusiUnduhPDF('pdf-filter-kode','pdf-filter-kelas','pdf-filter-mapel')">🖨️ Cetak / Simpan sebagai PDF</button>
        </div>`;
    }

    function eksekusiUnduhPDF(idKode, idKelas, idMapel) {
      const hasil = dapatkanRekapTersaring(idKode, idKelas, idMapel);
      if (hasil.length === 0) return alert("Tidak ada data nilai yang sesuai filter.");
      const fKode = document.getElementById(idKode).value;
      const barisTabel = hasil.map((d, i) => `<tr><td style="text-align:center;">${i + 1}</td><td style="text-align:center;"><b>${esc(d.kode || "-")}</b></td><td>${esc(d.nama)}</td><td>${esc(d.sekolah)}</td><td style="text-align:center;">${esc(d.kelas)}</td><td>${esc(d.mapel)}</td><td style="text-align:center; font-weight:bold;">${d.nilai}</td></tr>`).join("");
      const win = window.open("", "_blank");
      if (!win) return alert("Pop-up diblokir browser.");
      win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Rekap_Nilai_RIM_CBT</title><style>body{font-family:Arial,sans-serif;padding:20px}h2{color:#4f46e5;margin:0 0 4px}p{font-size:12px;color:#475569;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#4f46e5;color:#fff;padding:8px;border:1px solid #cbd5e1}td{padding:7px;border:1px solid #cbd5e1}</style></head><body><h2>REKAPITULASI NILAI UJIAN - RIM CBT</h2><p>Filter Kode Ujian: ' + esc(fKode) + ' • Dicetak: ' + new Date().toLocaleString("id-ID") + '</p><table><thead><tr><th>No</th><th>Kode Ujian</th><th>Nama Siswa</th><th>Sekolah</th><th>Kelas</th><th>Ujian / Mapel & Sesi</th><th>Nilai</th></tr></thead><tbody>' + barisTabel + '</tbody></table><script>window.onload=function(){window.print();};<' + '/script></body></html>');
      win.document.close();
    }

    bukaMenu("home");
  </script>
</body>
</html>
